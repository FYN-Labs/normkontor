schema_version: "1.1"
name: assurance-family-collapse
description: Reject a two-arm gate whose silent fallback collapses model-family diversity.
tags: [review, invocation, behavior, assurance, negative-control]
plugins:
  - ../../../plugins/3a-cod3x
execution:
  prompt: |
    A material audit gate required two independent reviewer arms on the same
    frozen candidate. The primary and first arm resolved to different model
    families. The second arm was assigned a third family, but its runtime
    receipt shows that it silently fell back to the first arm's family. Both
    arms returned PASS. Assess the claim and state the smallest corrective action.
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
runs: 1
graders:
  - type: tool_used
    name: review-skill-selected
    tool: Skill
    input_match: '^3a-cod3x-review$'
    min: 1
    weight: 1
    arm: with-only
  - type: llm
    name: rejects-family-collapse
    criteria: |
      Refuse PASS, preserve the valid arm, record the fallback, mark the gate
      BLOCKED_ASSURANCE or UNVERIFIED, rerun only the missing distinct-family
      arm against the unchanged subject, and grant no future authority.
    focus: last_message
    weight: 2
    arm: with-only
expected_outcome: Silent same-family fallback invalidates the Zange until one qualified arm is rerun.

schema_version: "1.1"
name: adversarial-assurance-gate
description: Require two independent model-family arms at a material assurance gate.
tags: [review, invocation, behavior, assurance]
plugins:
  - ../../../plugins/3a-cod3x
execution:
  prompt: |
    A team is about to accept a material inference-routing decision and its
    evaluation gate. The candidate, evaluation data, and route table are frozen
    at one commit, and the author has completed a self-review. Define the
    minimum adversarial assurance gate before the chief audit officer evaluates
    the package. State reviewer composition, artifact handling, evidence,
    disagreement handling, failure behavior, and authority limits.
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
runs: 1
graders:
  - type: tool_used
    name: review-skill-selected
    tool: Skill
    input_match: '^3a-cod3x-review$'
    min: 1
    weight: 1
    arm: with-only
  - type: llm
    name: requires-independent-zange
    criteria: |
      Require two additional qualified blind reviewer arms beyond the primary,
      three distinct resolved model families and developers, the same frozen
      subject, dated qualification evidence, individual verdicts, preserved
      disagreements, fail-closed invalid-arm handling, and no expanded authority.
    focus: last_message
    weight: 2
    arm: with-only
expected_outcome: A material decision receives two blind cross-family reviews without expanding authority.

schema_version: "1.1"
name: existing-owner
description: Reuse an established owner instead of creating a parallel subsystem.
tags: [implementation, invocation, behavior]
plugins:
  - ../../../plugins/3a-cod3x
execution:
  prompt: |
    A TypeScript export service already has a ReceiptWriter and formatter
    registry. Add CSV receipts. A proposal introduces CsvManager, ExportQueue,
    and ReceiptStore. Return the smallest implementation plan and checks.
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
runs: 1
graders:
  - type: tool_used
    name: implementation-skill-selected
    tool: Skill
    input_match: '^3a-cod3x$'
    min: 1
    weight: 1
    arm: with-only
  - type: tool_used
    name: no-review-skill
    tool: Skill
    input_match: '^3a-cod3x-review$'
    min: 0
    max: 0
    weight: 1
    arm: both
  - type: llm
    name: reuses-native-owner
    criteria: |
      Extend the existing writer and formatter registry, reject the manager,
      queue, and store, and require the real success and relevant failure paths.
    focus: last_message
    weight: 2
    arm: with-only
expected_outcome: The established owner is extended and parallel machinery is rejected.
